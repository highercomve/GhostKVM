; GhostKVM USB bridge for the ESP32-S3-DevKitC-1.
;
; The "UART" port (USB-to-serial bridge) goes to the computer running
; GhostKVM; the native "USB" port goes to the device being controlled, which
; sees a standard USB keyboard and mouse.
;
;   make firmware                       build
;   make flash PORT=/dev/ttyUSB0        flash over the UART port

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=0          ; native port runs TinyUSB (device), not USB-serial/JTAG
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial is UART0, i.e. the "UART" port
    ; The USB library's mass-storage files include FS.h but PlatformIO builds
    ; libraries only with their own detected dependencies; make FS global.
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
; The board default sets USB mode 1 (USB-serial/JTAG); we need TinyUSB.
build_unflags = -DARDUINO_USB_MODE=1
lib_deps = FS
